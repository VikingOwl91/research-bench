name: Verify ResearchBench
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.11.1
          cache: pnpm
      - uses: dtolnay/rust-toolchain@a2627de80e5819949c7e1c83ed99b29085fc9bc4 # 1.98.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: crates/research-core
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: browser-assets
        with:
          path: |
            static/models
            static/pdfium
            static/runtime
            .cache/tools
          key: browser-assets-${{ hashFiles('scripts/assets-manifest.json', 'scripts/model-assets.mjs', 'scripts/build-wasm.mjs') }}
      - run: pnpm install --frozen-lockfile
      - run: node scripts/prepare-assets.mjs
      - run: node scripts/prepare-assets.mjs --verify
      - run: node scripts/build-wasm.mjs
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.browser-assets.outputs.cache-hit != 'true'
        with:
          path: |
            static/models
            static/pdfium
            static/runtime
            .cache/tools
          key: ${{ steps.browser-assets.outputs.cache-primary-key }}
      - run: pnpm verify
      - run: node scripts/check-build-paths.mjs
      - run: pnpm source:prepare --expected-head "${{ github.sha }}"
      - run: pnpm exec playwright install --with-deps chromium firefox
      - name: Provide isolated audio output for native playback tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils
          export PULSE_RUNTIME_PATH="$RUNNER_TEMP/researchbench-pulse"
          install -d -m 700 "$PULSE_RUNTIME_PATH"
          export PULSE_SERVER="unix:$PULSE_RUNTIME_PATH/native"
          pulseaudio -n --daemonize=yes --fail=yes --exit-idle-time=-1 --use-pid-file=no \
            --load="module-native-protocol-unix socket=$PULSE_RUNTIME_PATH/native auth-anonymous=1" \
            --load="module-null-sink sink_name=researchbench_fixture"
          pactl --server="$PULSE_SERVER" set-default-sink researchbench_fixture
          test "$(pactl --server="$PULSE_SERVER" get-default-sink)" = researchbench_fixture
          printf 'PULSE_SERVER=%s\n' "$PULSE_SERVER" >> "$GITHUB_ENV"
      - run: pnpm test:e2e
      - run: pnpm test:security
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 7
