name: Verify ResearchBench
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: 26.11.1
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/research-core
      - uses: actions/cache@v4
        with:
          path: |
            static/models
            static/pdfium
            static/runtime
            .cache/tools
          key: browser-assets-${{ hashFiles('scripts/assets-manifest.json', 'scripts/model-assets.mjs', 'scripts/build-wasm.mjs') }}
      - run: pnpm install --frozen-lockfile
      - run: node scripts/prepare-assets.mjs
      - run: node scripts/prepare-assets.mjs --verify
      - run: node scripts/build-wasm.mjs
      - run: pnpm verify
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: pnpm test:e2e
      - run: pnpm test:security
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 7
