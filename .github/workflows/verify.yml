name: Verify ResearchBench
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: 26.11.1
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/research-core
      - uses: actions/cache/restore@v4
        id: browser-assets
        with:
          path: |
            static/models
            static/pdfium
            static/runtime
            .cache/tools
          key: browser-assets-${{ hashFiles('scripts/assets-manifest.json', 'scripts/model-assets.mjs', 'scripts/build-wasm.mjs') }}
      - run: pnpm install --frozen-lockfile
      - run: node scripts/prepare-assets.mjs
      - run: node scripts/prepare-assets.mjs --verify
      - run: node scripts/build-wasm.mjs
      - uses: actions/cache/save@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.browser-assets.outputs.cache-hit != 'true'
        with:
          path: |
            static/models
            static/pdfium
            static/runtime
            .cache/tools
          key: ${{ steps.browser-assets.outputs.cache-primary-key }}
      - run: pnpm verify
      - run: pnpm source:prepare --expected-head "${{ github.sha }}"
      - run: pnpm exec playwright install --with-deps chromium firefox
      - name: Provide isolated audio output for native playback tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils
          export PULSE_RUNTIME_PATH="$RUNNER_TEMP/researchbench-pulse"
          install -d -m 700 "$PULSE_RUNTIME_PATH"
          export PULSE_SERVER="unix:$PULSE_RUNTIME_PATH/native"
          pulseaudio -n --daemonize=yes --fail=yes --exit-idle-time=-1 --use-pid-file=no \
            --load="module-native-protocol-unix socket=$PULSE_RUNTIME_PATH/native auth-anonymous=1" \
            --load="module-null-sink sink_name=researchbench_fixture"
          pactl --server="$PULSE_SERVER" set-default-sink researchbench_fixture
          test "$(pactl --server="$PULSE_SERVER" get-default-sink)" = researchbench_fixture
          printf 'PULSE_SERVER=%s\n' "$PULSE_SERVER" >> "$GITHUB_ENV"
      - run: pnpm test:e2e
      - run: pnpm test:security
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 7
